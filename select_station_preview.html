<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PARCO Select Station Preview</title>
<style>
  :root{
    --brand-red:#D71920;
    --primary-text:#172B4D;
    --secondary-text:#5E6C84;
    --bg:#F6F8FB;
    --card-bg:#FFFFFF;
    --border:#E2E8F0;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#EDEFF3;
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    padding:24px;
  }
  .phone{
    position:relative;
    width:430px;
    height:932px;
    border-radius:46px;
    box-shadow:0 24px 60px rgba(23,43,77,0.25);
    overflow:hidden;
    border:10px solid #111;
    background:var(--bg);
    display:flex;
    flex-direction:column;
  }

  .appbar{
    padding:24px 24px 16px;
    background:var(--card-bg);
    border-bottom:1px solid var(--border);
  }
  .appbar h1{
    margin:0 0 14px;
    font-size:19px;
    font-weight:700;
    color:var(--primary-text);
  }
  .search{
    display:flex;
    align-items:center;
    gap:10px;
    height:46px;
    border-radius:12px;
    background:var(--bg);
    border:1px solid var(--border);
    padding:0 14px;
  }
  .search input{
    border:none;background:none;outline:none;
    flex:1;font-size:14px;color:var(--primary-text);
  }
  .search input::placeholder{color:#9AA5B8;}

  .content{
    flex:1;
    overflow-y:auto;
    padding:18px 20px 100px;
  }

  .station-row{
    display:flex;
    align-items:center;
    gap:14px;
    border-radius:16px;
    padding:16px;
    margin-bottom:12px;
    border:1px solid var(--border);
    background:var(--card-bg);
  }
  .station-row.selected{
    background:var(--brand-red);
    border-color:var(--brand-red);
  }
  .station-row .icon{
    width:42px;height:42px;
    border-radius:12px;
    background:#FFF1F2;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .station-row.selected .icon{background:rgba(255,255,255,0.18);}
  .station-row .icon svg{stroke:#D71920;}
  .station-row.selected .icon svg{stroke:#fff;}

  .station-row .info{flex:1; min-width:0;}
  .station-row .info .name{
    font-size:15px;font-weight:700;color:var(--primary-text);
  }
  .station-row.selected .info .name{color:#fff;}
  .station-row .info .meta{
    font-size:12px;color:var(--secondary-text);margin-top:2px;
  }
  .station-row.selected .info .meta{color:rgba(255,255,255,0.8);}

  .edit-btn{
    width:36px;height:36px;
    border-radius:50%;
    background:var(--bg);
    border:none;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    cursor:pointer;
  }
  .station-row.selected .edit-btn{background:rgba(255,255,255,0.18);}
  .edit-btn svg{stroke:#5E6C84;}
  .station-row.selected .edit-btn svg{stroke:#fff;}

  .footer{
    position:absolute;
    left:0;right:0;bottom:0;
    padding:16px 20px calc(20px + env(safe-area-inset-bottom, 0px));
    background:var(--card-bg);
    border-top:1px solid var(--border);
  }
  .add-btn{
    width:100%;
    height:52px;
    border-radius:14px;
    background:#fff;
    border:1.5px dashed var(--brand-red);
    color:var(--brand-red);
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
</style>
</head>
<body>
<div class="phone">

  <div class="appbar">
    <h1>Select Station</h1>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E6C84" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" placeholder="Select station......">
    </div>
  </div>

  <div class="content">
    <div class="station-row selected">
      <div class="icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M4 22V4a2 2 0 012-2h6a2 2 0 012 2v18"/><path d="M4 10h10"/><path d="M14 8l3 2v8a2 2 0 002 2h0a2 2 0 002-2v-6l-3-3"/></svg>
      </div>
      <div class="info">
        <div class="name">Amir Filling, Pattoki</div>
        <div class="meta">Currently selected</div>
      </div>
      <button class="edit-btn" aria-label="Edit station">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
      </button>
    </div>

    <div class="station-row">
      <div class="icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M4 22V4a2 2 0 012-2h6a2 2 0 012 2v18"/><path d="M4 10h10"/><path d="M14 8l3 2v8a2 2 0 002 2h0a2 2 0 002-2v-6l-3-3"/></svg>
      </div>
      <div class="info">
        <div class="name">Station 2</div>
        <div class="meta">Tap to switch</div>
      </div>
      <button class="edit-btn" aria-label="Edit station">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
      </button>
    </div>
  </div>

  <div class="footer">
    <button class="add-btn" type="button">+ Add Station</button>
  </div>

</div>
</body>
</html>
