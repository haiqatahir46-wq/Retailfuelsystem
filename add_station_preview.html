<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PARCO Add New Station Preview</title>
<style>
  :root{
    --brand-red:#D71920;
    --primary-text:#172B4D;
    --secondary-text:#5E6C84;
    --bg:#F6F8FB;
    --card-bg:#FFFFFF;
    --border:#E2E8F0;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#EDEFF3;
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    padding:24px;
  }
  .phone{
    position:relative;
    width:430px;
    height:932px;
    border-radius:46px;
    box-shadow:0 24px 60px rgba(23,43,77,0.25);
    overflow:hidden;
    border:10px solid #111;
    background:var(--bg);
    display:flex;
    flex-direction:column;
  }

  .appbar{
    display:flex;
    align-items:center;
    gap:14px;
    padding:20px 20px 16px;
    background:var(--card-bg);
    border-bottom:1px solid var(--border);
  }
  .appbar .back{
    width:36px;height:36px;
    border-radius:50%;
    background:var(--bg);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .appbar h1{
    margin:0;
    font-size:17px;
    font-weight:700;
    color:var(--primary-text);
  }

  .content{
    flex:1;
    overflow-y:auto;
    padding:22px 24px 30px;
  }

  .section-label{
    font-size:12px;
    font-weight:700;
    letter-spacing:.5px;
    color:var(--secondary-text);
    text-transform:uppercase;
    margin:22px 0 12px;
  }
  .section-label:first-child{margin-top:0;}

  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--secondary-text);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    height:48px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--card-bg);
    padding:0 16px;
    font-size:14px;
    color:var(--primary-text);
    outline:none;
  }
  .field input:focus{border-color:var(--brand-red);}
  .field input::placeholder{color:#9AA5B8;}

  .field-row{display:flex; gap:12px;}
  .field-row .field{flex:1;}

  .unit-field .input-wrap{position:relative;}
  .unit-field input{padding-right:44px;}
  .unit-field .unit{
    position:absolute;right:14px;top:50%;transform:translateY(-50%);
    font-size:12px;font-weight:700;color:var(--secondary-text);
  }

  .save-btn{
    width:100%;
    height:52px;
    border:none;
    border-radius:14px;
    background:var(--brand-red);
    color:#fff;
    font-size:15px;
    font-weight:700;
    letter-spacing:.3px;
    cursor:pointer;
    box-shadow:0 10px 22px rgba(215,25,32,.3);
    margin-top:8px;
  }
</style>
</head>
<body>
<div class="phone">

  <div class="appbar">
    <div class="back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#172B4D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <h1>Add New Station</h1>
  </div>

  <div class="content">
    <div class="field">
      <label for="s-name">Station Name</label>
      <input id="s-name" type="text" placeholder="e.g. Amir Filling, Pattoki">
    </div>
    <div class="field">
      <label for="s-loc">Station Location</label>
      <input id="s-loc" type="text" placeholder="Enter address or area">
    </div>

    <div class="section-label">Nozzles</div>
    <div class="field-row">
      <div class="field">
        <label for="n-petrol">Petrol</label>
        <input id="n-petrol" type="number" min="0" placeholder="0">
      </div>
      <div class="field">
        <label for="n-diesel">Diesel</label>
        <input id="n-diesel" type="number" min="0" placeholder="0">
      </div>
      <div class="field">
        <label for="n-octane">Hi-Octane</label>
        <input id="n-octane" type="number" min="0" placeholder="0">
      </div>
    </div>

    <div class="section-label">Storage Capacity</div>
    <div class="field unit-field">
      <label for="c-petrol">Petrol</label>
      <div class="input-wrap">
        <input id="c-petrol" type="number" min="0" placeholder="0">
        <span class="unit">L</span>
      </div>
    </div>
    <div class="field unit-field">
      <label for="c-diesel">Diesel</label>
      <div class="input-wrap">
        <input id="c-diesel" type="number" min="0" placeholder="0">
        <span class="unit">L</span>
      </div>
    </div>
    <div class="field unit-field">
      <label for="c-octane">Hi-Octane</label>
      <div class="input-wrap">
        <input id="c-octane" type="number" min="0" placeholder="0">
        <span class="unit">L</span>
      </div>
    </div>

    <button class="save-btn" type="button">Add Station</button>
  </div>

</div>
</body>
</html>
