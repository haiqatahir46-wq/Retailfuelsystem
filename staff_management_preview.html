<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PARCO Staff Management Preview</title>
<style>
  :root{
    --brand-red:#D71920;--red-light:#FFF1F2;--primary-text:#172B4D;--secondary-text:#5E6C84;
    --bg:#F6F8FB;--card-bg:#FFFFFF;--border:#E2E8F0;--dispensing:#22A06B;--attention:#E08E0B;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#EDEFF3;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;padding:24px;}
  .phone{width:430px;height:932px;background:var(--bg);border-radius:46px;box-shadow:0 24px 60px rgba(23,43,77,0.25);border:10px solid #111;display:flex;flex-direction:column;overflow:hidden;}
  .appbar{padding:14px 16px;display:flex;align-items:center;gap:10px;background:var(--card-bg);border-bottom:1px solid var(--border);}
  .appbar .back{cursor:pointer;color:var(--primary-text);display:flex;}
  .appbar .title{font-size:17px;font-weight:700;color:var(--primary-text);}
  .count{padding:14px 20px 4px;font-size:13px;font-weight:600;color:var(--secondary-text);}
  .content{flex:1;overflow-y:auto;padding:8px 20px 12px;display:flex;flex-direction:column;gap:10px;}
  .staff-card{display:flex;align-items:center;gap:12px;background:var(--card-bg);border-radius:14px;padding:14px;box-shadow:0 1px 4px rgba(23,43,77,0.06);cursor:pointer;}
  .staff-avatar{width:44px;height:44px;border-radius:50%;background:var(--red-light);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--brand-red);font-weight:700;font-size:16px;}
  .staff-info{flex:1;min-width:0;}
  .staff-name{font-size:14.5px;font-weight:700;color:var(--primary-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .staff-sub{font-size:12px;color:var(--secondary-text);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .status-pill{font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;flex-shrink:0;}
  .status-active{background:rgba(34,160,107,0.12);color:var(--dispensing);}
  .status-leave{background:rgba(224,142,11,0.12);color:var(--attention);}
  .add-btn-wrap{padding:4px 20px 16px;}
  .add-btn{height:50px;width:100%;border-radius:14px;background:transparent;color:var(--brand-red);border:1.5px solid var(--brand-red);font-size:14px;font-weight:700;cursor:pointer;}
</style>
</head>
<body>
<div class="phone">
  <div class="appbar">
    <span class="back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#172B4D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></span>
    <span class="title">Staff Management</span>
  </div>
  <div class="count">5 Staff Members</div>
  <div class="content">
    <div class="staff-card" onclick="alert('Bilal Ahmed')">
      <div class="staff-avatar">B</div>
      <div class="staff-info"><div class="staff-name">Bilal Ahmed</div><div class="staff-sub">Manager &middot; +92 301 2345678</div></div>
      <div class="status-pill status-active">Active</div>
    </div>
    <div class="staff-card" onclick="alert('Kamran Iqbal')">
      <div class="staff-avatar">K</div>
      <div class="staff-info"><div class="staff-name">Kamran Iqbal</div><div class="staff-sub">Attendant &middot; +92 302 3456789</div></div>
      <div class="status-pill status-active">Active</div>
    </div>
    <div class="staff-card" onclick="alert('Zubair Hussain')">
      <div class="staff-avatar">Z</div>
      <div class="staff-info"><div class="staff-name">Zubair Hussain</div><div class="staff-sub">Attendant &middot; +92 303 4567890</div></div>
      <div class="status-pill status-leave">On Leave</div>
    </div>
    <div class="staff-card" onclick="alert('Nadia Sultan')">
      <div class="staff-avatar">N</div>
      <div class="staff-info"><div class="staff-name">Nadia Sultan</div><div class="staff-sub">Cashier &middot; +92 304 5678901</div></div>
      <div class="status-pill status-active">Active</div>
    </div>
    <div class="staff-card" onclick="alert('Imran Sheikh')">
      <div class="staff-avatar">I</div>
      <div class="staff-info"><div class="staff-name">Imran Sheikh</div><div class="staff-sub">Attendant &middot; +92 305 6789012</div></div>
      <div class="status-pill status-active">Active</div>
    </div>
  </div>
  <div class="add-btn-wrap">
    <button class="add-btn" onclick="alert('Add Staff')">+ Add Staff</button>
  </div>
</div>
</body>
</html>
