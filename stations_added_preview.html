<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PARCO Stations Added Screen Preview</title>
<style>
  :root{
    --brand-red:#D71920;
    --primary-text:#172B4D;
    --secondary-text:#5E6C84;
    --bg:#F6F8FB;
    --card-bg:#FFFFFF;
    --border:#E2E8F0;
    --success:#22A06B;
    --success-light:#E7F6EF;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#EDEFF3;
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    padding:24px;
  }
  .phone{
    position:relative;
    width:430px;
    height:932px;
    border-radius:46px;
    box-shadow:0 24px 60px rgba(23,43,77,0.25);
    overflow:hidden;
    border:10px solid #111;
    background:#fff;
  }

  /* ---------- Station image panel (same wave family, shortest yet) ---------- */
  .scene{
    position:absolute;
    top:0;left:0;right:0;
    height:260px;
    background:#fff;
    clip-path:url(#waveClipAdded);
  }
  .scene img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 40%;
  }

  /* ---------- Content panel ---------- */
  .content-panel{
    position:absolute;
    left:0;right:0;bottom:0;
    height:672px;
    background:var(--card-bg);
    padding:8px 28px 30px;
    overflow-y:auto;
    animation:formIn .9s cubic-bezier(.16,.84,.44,1) both;
  }
  @keyframes formIn{
    from{ transform:translateY(30px); opacity:0; }
    to{ transform:translateY(0); opacity:1; }
  }

  .success-icon{
    width:64px;height:64px;
    border-radius:50%;
    background:var(--success-light);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 18px;
  }

  .heading-block{
    text-align:center;
    margin-bottom:24px;
  }
  .heading-block h1{
    margin:0;
    font-size:22px;
    font-weight:700;
    color:var(--primary-text);
  }
  .heading-block p{
    margin:6px 0 0;
    font-size:13px;
    color:var(--secondary-text);
  }

  .section-label{
    font-size:12px;
    font-weight:700;
    letter-spacing:.5px;
    color:var(--secondary-text);
    text-transform:uppercase;
    margin-bottom:10px;
  }

  .station-card{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px;
    margin-bottom:12px;
  }
  .station-card .icon{
    width:44px;height:44px;
    border-radius:12px;
    background:#FFF1F2;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .station-card .info{flex:1; min-width:0;}
  .station-card .info .name{
    font-size:14px;font-weight:700;color:var(--primary-text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .station-card .info .meta{
    font-size:12px;color:var(--secondary-text);margin-top:2px;
  }
  .edit-btn{
    width:36px;height:36px;
    border-radius:50%;
    background:var(--bg);
    border:none;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    cursor:pointer;
  }
  .edit-btn svg{stroke:#5E6C84;}

  .continue-btn{
    width:100%;
    height:52px;
    border:none;
    border-radius:14px;
    background:var(--brand-red);
    color:#fff;
    font-size:15px;
    font-weight:700;
    letter-spacing:.3px;
    cursor:pointer;
    box-shadow:0 10px 22px rgba(215,25,32,.3);
    margin-top:22px;
  }

  .add-more{
    width:100%;
    height:48px;
    border-radius:14px;
    background:#fff;
    border:1.5px dashed var(--border);
    color:var(--secondary-text);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    margin-top:12px;
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- Same wave family as splash/login/signup, rescaled to this shorter panel. -->
    <clipPath id="waveClipAdded" clipPathUnits="userSpaceOnUse">
      <path d="M0,200 C121,235 176,235 215,215 C254,195 309,160 430,180 L430,0 L0,0 Z"/>
    </clipPath>
  </defs>
</svg>

<div class="phone">

  <div class="scene">
    <img src="station.webp" alt="TOTAL PARCO filling station">
  </div>

  <div class="content-panel">
    <div class="success-icon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#22A06B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>

    <div class="heading-block">
      <h1>Station Added</h1>
      <p>Your account is set up and ready to go</p>
    </div>

    <div class="section-label">Your Stations (2)</div>

    <div class="station-card">
      <div class="icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#D71920" stroke-width="2"><path d="M4 22V4a2 2 0 012-2h6a2 2 0 012 2v18"/><path d="M4 10h10"/><path d="M14 8l3 2v8a2 2 0 002 2h0a2 2 0 002-2v-6l-3-3"/></svg>
      </div>
      <div class="info">
        <div class="name">Amir Filling, Pattoki</div>
        <div class="meta">Primary station</div>
      </div>
      <button class="edit-btn" aria-label="Edit station">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
      </button>
    </div>

    <div class="station-card">
      <div class="icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#D71920" stroke-width="2"><path d="M4 22V4a2 2 0 012-2h6a2 2 0 012 2v18"/><path d="M4 10h10"/><path d="M14 8l3 2v8a2 2 0 002 2h0a2 2 0 002-2v-6l-3-3"/></svg>
      </div>
      <div class="info">
        <div class="name">Station 2</div>
        <div class="meta">Setup pending</div>
      </div>
      <button class="edit-btn" aria-label="Edit station">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
      </button>
    </div>

    <button class="add-more" type="button">+ Add Another Station</button>

    <button class="continue-btn" type="button">Continue to Dashboard</button>
  </div>

</div>
</body>
</html>
