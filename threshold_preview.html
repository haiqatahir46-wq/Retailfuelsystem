<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PARCO Reorder Threshold Preview</title>
<style>
  :root{
    --brand-red:#D71920;--red-light:#FFF1F2;--primary-text:#172B4D;--secondary-text:#5E6C84;
    --bg:#F6F8FB;--card-bg:#FFFFFF;--border:#E2E8F0;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#EDEFF3;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;padding:24px;}
  .phone{width:430px;height:932px;background:var(--bg);border-radius:46px;box-shadow:0 24px 60px rgba(23,43,77,0.25);border:10px solid #111;display:flex;flex-direction:column;overflow:hidden;}
  .appbar{padding:14px 16px;display:flex;align-items:center;gap:10px;background:var(--card-bg);border-bottom:1px solid var(--border);}
  .appbar .back{cursor:pointer;display:flex;}
  .appbar .title{font-size:17px;font-weight:700;color:var(--primary-text);}
  .content{flex:1;overflow-y:auto;padding:16px 20px 20px;}
  .heading{font-size:16px;font-weight:700;color:var(--primary-text);margin-bottom:18px;}
  .tank-card{background:var(--card-bg);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(23,43,77,0.06);}
  .tank-name{font-size:15px;font-weight:700;color:var(--primary-text);margin-bottom:10px;}
  .stat-row{display:flex;margin-bottom:12px;}
  .stat{flex:1;}
  .stat .value{font-size:13.5px;font-weight:700;color:var(--primary-text);}
  .stat .label{font-size:10.5px;color:var(--secondary-text);margin-top:2px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--secondary-text);margin-bottom:6px;}
  .field input{width:100%;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--bg);padding:0 14px;font-size:14px;color:var(--primary-text);font-family:inherit;}
  .field input:focus{outline:none;border-color:var(--brand-red);border-width:1.4px;}
  .btn-row{display:flex;gap:10px;}
  .btn-row button{flex:1;height:42px;border-radius:12px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .reorder-btn{background:transparent;border:1.4px solid var(--border);color:var(--secondary-text);}
  .confirm-btn{background:var(--brand-red);border:none;color:#fff;}
</style>
</head>
<body>
<div class="phone">
  <div class="appbar">
    <span class="back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#172B4D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></span>
    <span class="title">Amir Filling Station</span>
  </div>
  <div class="content">
    <div class="heading">Reorder Threshold</div>

    <div class="tank-card">
      <div class="tank-name">Petrol</div>
      <div class="stat-row">
        <div class="stat"><div class="value">25,000 L</div><div class="label">Tank Capacity</div></div>
        <div class="stat"><div class="value">7,000 L</div><div class="label">Current Volume</div></div>
      </div>
      <div class="field"><label>Threshold (L)</label><input type="number" value="18000"></div>
      <div class="btn-row">
        <button class="reorder-btn" onclick="alert('Reorder - Petrol')">Reorder</button>
        <button class="confirm-btn" onclick="alert('Confirm - Petrol threshold')">Confirm</button>
      </div>
    </div>

    <div class="tank-card">
      <div class="tank-name">Diesel</div>
      <div class="stat-row">
        <div class="stat"><div class="value">25,000 L</div><div class="label">Tank Capacity</div></div>
        <div class="stat"><div class="value">16,000 L</div><div class="label">Current Volume</div></div>
      </div>
      <div class="field"><label>Threshold (L)</label><input type="number" value="18000"></div>
      <div class="btn-row">
        <button class="reorder-btn" onclick="alert('Reorder - Diesel')">Reorder</button>
        <button class="confirm-btn" onclick="alert('Confirm - Diesel threshold')">Confirm</button>
      </div>
    </div>

    <div class="tank-card">
      <div class="tank-name">Hi-Octane</div>
      <div class="stat-row">
        <div class="stat"><div class="value">25,000 L</div><div class="label">Tank Capacity</div></div>
        <div class="stat"><div class="value">22,000 L</div><div class="label">Current Volume</div></div>
      </div>
      <div class="field"><label>Threshold (L)</label><input type="number" value="18000"></div>
      <div class="btn-row">
        <button class="reorder-btn" onclick="alert('Reorder - Hi-Octane')">Reorder</button>
        <button class="confirm-btn" onclick="alert('Confirm - Hi-Octane threshold')">Confirm</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
