<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PARCO Account Details Preview</title>
<style>
  :root{
    --brand-red:#D71920;--red-light:#FFF1F2;--primary-text:#172B4D;--secondary-text:#5E6C84;
    --bg:#F6F8FB;--card-bg:#FFFFFF;--border:#E2E8F0;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#EDEFF3;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;padding:24px;}
  .phone{width:430px;height:932px;background:var(--bg);border-radius:46px;box-shadow:0 24px 60px rgba(23,43,77,0.25);border:10px solid #111;display:flex;flex-direction:column;overflow:hidden;}
  .appbar{padding:14px 16px;display:flex;align-items:center;gap:10px;background:var(--card-bg);border-bottom:1px solid var(--border);}
  .appbar .back{cursor:pointer;display:flex;}
  .appbar .title{font-size:17px;font-weight:700;color:var(--primary-text);}
  .content{flex:1;overflow-y:auto;padding:16px 20px 24px;}
  .heading{font-size:16px;font-weight:700;color:var(--primary-text);margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--secondary-text);margin-bottom:6px;}
  .field input{
    width:100%;height:48px;border-radius:12px;border:1px solid var(--border);
    background:var(--bg);padding:0 16px;font-size:14px;color:var(--primary-text);
    font-family:inherit;
  }
  .field input:focus{outline:none;border-color:var(--brand-red);border-width:1.4px;}
  .submit-btn{margin-top:10px;height:50px;width:100%;border-radius:14px;background:var(--brand-red);color:#fff;border:none;font-size:14px;font-weight:700;cursor:pointer;}
</style>
</head>
<body>
<div class="phone">
  <div class="appbar">
    <span class="back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#172B4D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></span>
    <span class="title">Amir Filling Station</span>
  </div>
  <div class="content">
    <!-- Blank form - the owner fills this in themselves, nothing is
         pre-filled with demo data. Fields match the Figma reference
         exactly. -->
    <div class="heading">Account Details</div>
    <div class="field"><label>Full Name</label><input type="text"></div>
    <div class="field"><label>Father Name</label><input type="text"></div>
    <div class="field"><label>CNIC</label><input type="text" inputmode="numeric"></div>
    <div class="field"><label>Email Address</label><input type="email"></div>
    <div class="field"><label>No. Of Stations</label><input type="number"></div>
    <div class="field"><label>No. Of Nozzles</label><input type="number"></div>
    <div class="field"><label>No. Of Managers</label><input type="number"></div>

    <button class="submit-btn" onclick="alert('Submit')">Submit</button>
  </div>
</div>
</body>
</html>
